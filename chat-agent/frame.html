<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Agent</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    html,body{width:100%;height:100%;overflow:hidden;background:#fff;}

    #biz-frame{
      position:absolute;top:0;left:0;right:0;bottom:0;
      width:100%;height:100%;border:none;outline:none;
      z-index:1;background:#fff;
    }

    /* Loading overlay */
    #loader{
      position:absolute;inset:0;background:#f5f5f5;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:10px;z-index:50;transition:opacity .3s ease;
    }
    #loader.gone{opacity:0;pointer-events:none;}
    .loader-dots{display:flex;gap:7px;}
    .loader-dot{width:9px;height:9px;border-radius:50%;background:#2E75B6;animation:ldot 1.2s ease-in-out infinite;}
    .loader-dot:nth-child(2){animation-delay:.2s;}
    .loader-dot:nth-child(3){animation-delay:.4s;}
    .loader-text{font-family:system-ui,sans-serif;font-size:11px;color:#8a9ab0;}
    @keyframes ldot{0%,80%,100%{transform:scale(.7);opacity:.5}40%{transform:scale(1);opacity:1}}

    /* Fallback when proxy fails */
    #fallback{
      display:none;position:absolute;inset:0;z-index:5;
      background:linear-gradient(160deg,#1a2e4a 0%,#0f1c2e 100%);
      flex-direction:column;align-items:center;justify-content:center;
      gap:12px;text-align:center;padding:28px;
    }
    #fallback.show{display:flex;}
    .fb-logo{font-family:'Montserrat',Arial,sans-serif;font-size:18px;line-height:1;margin-bottom:4px;}
    .fb-logo .s{font-weight:700;color:#fff;}
    .fb-logo .l{font-weight:400;color:#2E75B6;}
    .fb-badge{display:flex;align-items:center;gap:6px;padding:4px 12px;border-radius:100px;background:rgba(46,204,113,0.12);border:1px solid rgba(46,204,113,0.35);font-size:.7rem;font-weight:600;color:#2ecc71;font-family:system-ui,sans-serif;}
    .fb-badge span{width:5px;height:5px;border-radius:50%;background:#2ecc71;animation:pulse 2s infinite;}
    .fb-msg{font-size:.72rem;color:rgba(255,255,255,0.5);max-width:200px;line-height:1.5;font-family:system-ui,sans-serif;}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

<div id="loader">
  <div class="loader-dots">
    <div class="loader-dot"></div>
    <div class="loader-dot"></div>
    <div class="loader-dot"></div>
  </div>
  <div class="loader-text" id="loader-text">Loading...</div>
</div>

<div id="fallback">
  <div class="fb-logo"><span class="s">Scale</span><span class="l">Local</span></div>
  <div class="fb-badge"><span></span> AI agent active</div>
  <div class="fb-msg">AI agent is live and ready to answer your questions.</div>
</div>

<iframe id="biz-frame" src="about:blank"
  sandbox="allow-scripts allow-same-origin allow-forms allow-popups"
></iframe>

<!-- Clear stale GHL chat history so every visitor sees a fresh greeting -->
<script>
(function(){
  try {
    var keysToNuke = [];
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);
      if(k&&(k.indexOf('lc_')===0||k.indexOf('leadconnector')!==-1||k.indexOf('msgsndr')!==-1||k.indexOf('chat_')===0||k.indexOf('widget_')===0||k.indexOf('conversation')!==-1||k.indexOf('contact_id')!==-1||k.indexOf('session')!==-1)){
        keysToNuke.push(k);
      }
    }
    keysToNuke.forEach(function(k){localStorage.removeItem(k);});
  }catch(e){}
})();
</script>

<!-- GHL Chat Widget -->
<script
  src="https://beta.leadconnectorhq.com/loader.js"
  data-resources-url="https://beta.leadconnectorhq.com/chat-widget/loader.js"
  data-widget-id="69c34fd013ad14bdd250aace"
></script>

<!-- Auto-open the widget, then auto-send demo context if a business name was provided -->
<script>
(function(){
  var params  = new URLSearchParams(window.location.search);
  var bizName = params.get('name') || '';
  var bizUrl  = params.get('url')  || '';
  var sent    = false;

  /* ─── Helper: recursively search shadow DOMs ─── */
  function findDeep(root, sel){
    if(!root) return null;
    var el = root.querySelector(sel);
    if(el) return el;
    var nodes = root.querySelectorAll('*');
    for(var i=0;i<nodes.length;i++){
      if(nodes[i].shadowRoot){
        el = findDeep(nodes[i].shadowRoot, sel);
        if(el) return el;
      }
    }
    return null;
  }

  /* ─── Step 1: Open the widget ─── */
  var openAttempts = 0;
  function tryOpen(){
    var el = document.querySelector('chat-widget');
    if(el && typeof el.open === 'function'){
      el.open();
      // After opening, wait for chat pane to appear then try to auto-send
      if(bizName) setTimeout(tryAutoSend, 2500);
      return;
    }
    if(++openAttempts < 75) setTimeout(tryOpen, 200);
  }

  /* ─── Step 2: Auto-send the demo context message ─── */
  var sendAttempts = 0;
  function tryAutoSend(){
    if(sent || !bizName) return;
    var widget = document.querySelector('chat-widget');
    if(!widget || !widget.shadowRoot) { retry(); return; }

    // First try to click "Chat via Live Chat" if the selection screen is showing
    var chatSel = findDeep(widget.shadowRoot, 'chat-selection');
    if(chatSel){
      var sr = chatSel.shadowRoot || chatSel;
      var btns = sr.querySelectorAll('ion-button');
      if(btns.length > 0){
        btns[0].click();
        // Wait for chat pane to load after clicking
        setTimeout(tryAutoSend, 2500);
        return;
      }
    }

    // Look for the textarea input
    var textarea = findDeep(widget.shadowRoot, 'textarea');
    if(!textarea){ retry(); return; }

    // Found textarea — send the demo context message
    var msg = 'Hi! I want to see a demo for ' + bizName + (bizUrl ? ' (' + bizUrl + ')' : '');
    textarea.focus();
    // Use native input setter to bypass framework restrictions
    var nativeSetter = Object.getOwnPropertyDescriptor(HTMLTextAreaElement.prototype, 'value').set;
    nativeSetter.call(textarea, msg);
    textarea.dispatchEvent(new Event('input', {bubbles:true}));
    textarea.dispatchEvent(new Event('change', {bubbles:true}));

    sent = true;

    // Click send button or press Enter
    setTimeout(function(){
      var btn = findDeep(widget.shadowRoot, '.live-chat-send-button') ||
                findDeep(widget.shadowRoot, 'button[type="submit"]') ||
                findDeep(widget.shadowRoot, '.send-button');
      if(btn){
        btn.click();
      } else {
        textarea.dispatchEvent(new KeyboardEvent('keydown', {key:'Enter',code:'Enter',keyCode:13,which:13,bubbles:true}));
        textarea.dispatchEvent(new KeyboardEvent('keypress',{key:'Enter',code:'Enter',keyCode:13,which:13,bubbles:true}));
        textarea.dispatchEvent(new KeyboardEvent('keyup',   {key:'Enter',code:'Enter',keyCode:13,which:13,bubbles:true}));
      }
    }, 400);
  }

  function retry(){
    if(++sendAttempts < 40) setTimeout(tryAutoSend, 600);
    // If all retries fail, just let the user chat manually — widget is still open
  }

  /* ─── Boot ─── */
  window.addEventListener('load', function(){ setTimeout(tryOpen, 1500); });
})();
</script>

<!-- Load the business site via proxy -->
<script>
(function(){
  var PROXY  = 'https://agentcopy-api.vercel.app/api/proxy?url=';
  var params = new URLSearchParams(window.location.search);
  var url    = params.get('url') || 'https://scalelocal.net';
  var name   = params.get('name') || 'ScaleLocal';

  var loader   = document.getElementById('loader');
  var fallback = document.getElementById('fallback');
  var frame    = document.getElementById('biz-frame');
  document.getElementById('loader-text').textContent = 'Loading ' + name + '...';

  function hideLoader(){
    loader.classList.add('gone');
    setTimeout(function(){ loader.style.display='none'; }, 350);
  }
  function showFallback(){
    loader.style.display = 'none';
    fallback.classList.add('show');
  }

  var timer = setTimeout(showFallback, 7000);

  frame.onload = function(){
    try {
      var doc = frame.contentDocument || frame.contentWindow.document;
      if(!doc || !doc.body || doc.body.innerHTML === ''){
        clearTimeout(timer); showFallback(); return;
      }
      try{ frame.contentWindow.scrollTo(0,0); }catch(e){}
    } catch(e) {
      // Cross-origin = loaded fine
    }
    clearTimeout(timer);
    hideLoader();
  };
  frame.onerror = function(){ clearTimeout(timer); showFallback(); };

  var fullUrl = url.startsWith('http') ? url : 'https://' + url;
  frame.src = PROXY + encodeURIComponent(fullUrl);
})();
</script>

</body>
</html>
