<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 540" role="img" aria-label="TNJ Landscape Masonry &amp; Asphalt">
  <defs>
    <!-- Inverted gradient for dark backgrounds: stays luminous, top fades to white instead of black -->
    <linearGradient id="tnj-grad-l" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#BFE2F4"/>
      <stop offset="22%" stop-color="#7FC0E2"/>
      <stop offset="48%" stop-color="#3F87B6"/>
      <stop offset="72%" stop-color="#E8ECEF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="landscape-grad-l" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E5EAF0"/>
      <stop offset="100%" stop-color="#B8BFC5"/>
    </linearGradient>
    <linearGradient id="masonry-grad-l" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9DD4F0"/>
      <stop offset="55%" stop-color="#5BA3D6"/>
      <stop offset="100%" stop-color="#3F87B6"/>
    </linearGradient>
    <filter id="soft-glow-l" x="-5%" y="-5%" width="110%" height="115%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g text-anchor="middle">
    <text x="350" y="290" font-family="Impact, 'Haettenschweiler', 'Arial Narrow Bold', 'Oswald', 'Arial Black', sans-serif" font-size="320" font-weight="900" fill="url(#tnj-grad-l)" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round" paint-order="stroke fill" textLength="440" lengthAdjust="spacingAndGlyphs" filter="url(#soft-glow-l)">TNJ</text>
    <text x="350" y="380" font-family="'Arial Black', 'Helvetica Neue', Impact, sans-serif" font-size="62" font-weight="900" fill="url(#landscape-grad-l)" stroke="#FFFFFF" stroke-width="0.8" textLength="440" lengthAdjust="spacingAndGlyphs">LANDSCAPE</text>
    <text x="350" y="475" font-family="'Arial Black', 'Helvetica Neue', Impact, sans-serif" font-size="56" font-weight="900" fill="url(#masonry-grad-l)" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round" paint-order="stroke fill" textLength="540" lengthAdjust="spacingAndGlyphs">MASONRY &amp; ASPHALT</text>
  </g>
</svg>
