<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" role="img" aria-label="TNJ Landscape Masonry & Asphalt">
  <defs>
    <linearGradient id="tnj-chrome-l" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9DD4F0"/>
      <stop offset="45%" stop-color="#5BA3D6"/>
      <stop offset="55%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E5EAF0"/>
    </linearGradient>
    <linearGradient id="tnj-chrome-rev-l" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7BC4E8"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#9DD4F0"/>
    </linearGradient>
  </defs>
  <g font-family="'Arial Black', 'Helvetica Neue', sans-serif" font-weight="900" text-anchor="middle">
    <text x="300" y="120" font-size="135" fill="url(#tnj-chrome-l)" stroke="#FFFFFF" stroke-width="3" letter-spacing="-2">TNJ</text>
    <text x="300" y="170" font-size="36" fill="#E5EAF0" letter-spacing="6">LANDSCAPE</text>
    <text x="300" y="210" font-size="28" fill="url(#tnj-chrome-rev-l)" stroke="#9DD4F0" stroke-width="0.6" letter-spacing="2">MASONRY &amp; ASPHALT</text>
