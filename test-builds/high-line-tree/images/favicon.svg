<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Green tree icon matching High Line Tree brand color -->
  <rect width="32" height="32" rx="6" fill="#1B7A3D"/>
  <!-- Tree crown (three layered triangles) -->
