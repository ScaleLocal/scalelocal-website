<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 376" width="360" height="376">
<defs>
  <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#D8DCDE"/><stop offset=".45" stop-color="#AEB5B9"/><stop offset="1" stop-color="#8E969B"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#EAD49A"/><stop offset=".35" stop-color="#C9A45A"/><stop offset=".65" stop-color="#9A7A3E"/><stop offset="1" stop-color="#D9BC7E"/>
  </linearGradient>
  <linearGradient id="goldText" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#EFD9A0"/><stop offset=".55" stop-color="#C9A45A"/><stop offset="1" stop-color="#A8854B"/>
  </linearGradient>
  <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#16301F"/><stop offset=".6" stop-color="#0F2316"/><stop offset="1" stop-color="#0A1A10"/>
  </linearGradient>
  <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#D7DCDE"/><stop offset="1" stop-color="#A9B1B5"/>
  </linearGradient>
  <clipPath id="fieldClip">
    <path d="M180,52 L252,52 L252,66 L272,66 L272,84 L288,84 L288,236 Q288,286 180,342 Q72,286 72,236 L72,84 L88,84 L88,66 L108,66 L108,52 Z"/>
  </clipPath>
</defs>

<!-- outer silver plaque -->
<path d="M180,18 L262,18 L262,36 L284,36 L284,56 L302,56 L302,240 Q302,302 180,366 Q58,302 58,240 L58,56 L76,56 L76,36 L98,36 L98,18 Z"
      fill="url(#silver)" stroke="#6E767B" stroke-width="2"/>
<!-- gold band -->
<path d="M180,34 L256,34 L256,50 L276,50 L276,69 L294,69 L294,238 Q294,294 180,354 Q66,294 66,238 L66,69 L84,69 L84,50 L104,50 L104,34 Z"
      fill="url(#gold)"/>
<!-- green field -->
<path d="M180,52 L252,52 L252,66 L272,66 L272,84 L288,84 L288,236 Q288,286 180,342 Q72,286 72,236 L72,84 L88,84 L88,66 L108,66 L108,52 Z"
      fill="url(#field)"/>

<g clip-path="url(#fieldClip)">
  <!-- gold arch rings -->
  <circle cx="180" cy="158" r="84" fill="none" stroke="url(#gold)" stroke-width="7"/>
  <circle cx="180" cy="158" r="74" fill="none" stroke="url(#gold)" stroke-width="2" opacity=".8"/>
