  <g stroke="#C9A45A" stroke-width="3" stroke-linecap="round" opacity=".75">
    <path d="M140,258 q20,4 44,1 q22,-2 36,1" fill="none"/>
    <path d="M152,268 q18,4 34,1 q16,-2 26,1" fill="none" opacity=".7"/>
    <path d="M164,278 q12,3 22,1 q10,-2 16,1" fill="none" opacity=".5"/>
  </g>
  <!-- SANTOS -->
  
  <!-- rules + & SONS -->
  
  <line x1="212" y1="330" x2="256" y2="340" stroke="#B9C0C3" stroke-width="1.6"/>
  
  <!-- PROPERTY MAINTENANCE -->
  
  
