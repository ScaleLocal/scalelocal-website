      <line x1="180" y1="138" x2="142" y2="100"/>
      <line x1="180" y1="138" x2="218" y2="100"/>
      <line x1="180" y1="138" x2="142" y2="176"/>
      <line x1="180" y1="138" x2="218" y2="176"/>
    </g>
    <circle cx="180" cy="138" r="5" fill="#EAD49A"/>
