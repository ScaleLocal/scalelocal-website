<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A modified bitumen flat roof being repaired with new membrane">
  <defs>
    <linearGradient id="fr-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7fb6d6"/>
      <stop offset="100%" stop-color="#cfe2ec"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#fr-sky)"/>
  <!-- Distant building tops -->
  <g fill="#3a4654" opacity="0.6">
    <rect x="0" y="280" width="120" height="60"/>
    <rect x="140" y="290" width="80" height="50"/>
    <rect x="660" y="285" width="100" height="55"/>
  </g>

  <!-- Flat rooftop surface (top-down/three-quarter perspective) -->
  <polygon points="0,300 800,300 800,600 0,600" fill="#3a3a3a"/>
  <!-- Membrane seams -->
  <g stroke="#1a1a1a" stroke-width="3" fill="none">
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="0" y1="420" x2="800" y2="420"/>
    <line x1="0" y1="480" x2="800" y2="480"/>
    <line x1="0" y1="540" x2="800" y2="540"/>
  </g>
  <!-- Membrane variation -->
  <g fill="#444" opacity="0.4">
    <rect x="0" y="300" width="800" height="60"/>
    <rect x="0" y="420" width="800" height="60"/>
    <rect x="0" y="540" width="800" height="60"/>
  </g>

  <!-- New repair patch (lighter, just applied) -->
  <polygon points="280,360 540,360 540,480 280,480" fill="#5a5a5a"/>
  <g stroke="#1a1a1a" stroke-width="2" fill="none">
    <line x1="280" y1="420" x2="540" y2="420"/>
  </g>
  <!-- Torched seal edges -->
  <g stroke="#1a1a1a" stroke-width="4" fill="none" opacity="0.6">
    <line x1="280" y1="360" x2="540" y2="360"/>
    <line x1="280" y1="480" x2="540" y2="480"/>
    <line x1="280" y1="360" x2="280" y2="480"/>
    <line x1="540" y1="360" x2="540" y2="480"/>
  </g>

  <!-- Parapet wall edge in distance -->
  <rect x="0" y="285" width="800" height="20" fill="#5a4a32"/>
  <rect x="0" y="280" width="800" height="6" fill="#a8a8a8"/>

  <!-- HVAC unit -->
  <g transform="translate(620, 200)">
    <rect x="0" y="0" width="120" height="80" fill="#a8a8a8" stroke="#5a5a5a" stroke-width="2"/>
    <rect x="10" y="10" width="100" height="60" fill="none" stroke="#5a5a5a" stroke-width="1.5"/>
    <g stroke="#5a5a5a" stroke-width="1">
      <line x1="15" y1="20" x2="105" y2="20"/>
      <line x1="15" y1="30" x2="105" y2="30"/>
      <line x1="15" y1="40" x2="105" y2="40"/>
      <line x1="15" y1="50" x2="105" y2="50"/>
      <line x1="15" y1="60" x2="105" y2="60"/>
    </g>
    <rect x="36" y="80" width="48" height="20" fill="#7a7a7a" stroke="#5a5a5a" stroke-width="1"/>
  </g>

  <!-- Vent pipe -->
  <g transform="translate(160, 240)">
    <rect x="0" y="0" width="20" height="60" fill="#6a6a6a"/>
    <ellipse cx="10" cy="0" rx="14" ry="6" fill="#8a8a8a"/>
  </g>

  <!-- Propane tank on the new patch (torch-down material) -->
  <g transform="translate(540, 430)">
    <rect x="0" y="0" width="24" height="50" fill="#7a3a3a" stroke="#3a1a1a" stroke-width="1"/>
    <rect x="-2" y="-4" width="28" height="6" fill="#3a1a1a"/>
  </g>
</svg>
