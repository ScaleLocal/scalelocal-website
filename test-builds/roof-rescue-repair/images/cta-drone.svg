<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Aerial view of a residential neighborhood in Dover, NH">
  <defs>
    <radialGradient id="ct-sky" cx="50%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#a8c8db"/>
      <stop offset="100%" stop-color="#3a5a78"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#ct-sky)"/>

  <!-- Aerial neighborhood: lawn checker -->
  <g>
    <rect x="0" y="400" width="1920" height="680" fill="#4a6e3a"/>
    <g fill="#5a7d3a">
      <rect x="0" y="500" width="1920" height="40"/>
      <rect x="0" y="620" width="1920" height="40"/>
      <rect x="0" y="740" width="1920" height="40"/>
      <rect x="0" y="860" width="1920" height="40"/>
      <rect x="0" y="980" width="1920" height="40"/>
    </g>
  </g>

  <!-- Tree shadows scattered -->
  <g fill="#2c4a3a" opacity="0.6">
    <ellipse cx="100" cy="500" rx="40" ry="50"/>
    <ellipse cx="380" cy="600" rx="36" ry="46"/>
    <ellipse cx="640" cy="720" rx="44" ry="54"/>
    <ellipse cx="1280" cy="540" rx="38" ry="48"/>
    <ellipse cx="1480" cy="680" rx="42" ry="52"/>
    <ellipse cx="1820" cy="800" rx="40" ry="50"/>
    <ellipse cx="200" cy="860" rx="36" ry="46"/>
    <ellipse cx="500" cy="940" rx="38" ry="48"/>
    <ellipse cx="900" cy="900" rx="44" ry="54"/>
    <ellipse cx="1700" cy="940" rx="40" ry="50"/>
  </g>

  <!-- Roads -->
  <g fill="#3a3a3a">
    <rect x="0" y="450" width="1920" height="22"/>
    <rect x="0" y="800" width="1920" height="22"/>
    <rect x="700" y="400" width="22" height="680"/>
    <rect x="1280" y="400" width="22" height="680"/>
  </g>
  <!-- Road markings -->
  <g stroke="#f3eedf" stroke-width="3" stroke-dasharray="20 16">
    <line x1="0" y1="461" x2="1920" y2="461"/>
    <line x1="0" y1="811" x2="1920" y2="811"/>
  </g>

  <!-- Houses (top-down) - scattered across the neighborhood -->
  <g>
    <!-- House 1 -->
    <g transform="translate(200, 500)">
      <rect x="0" y="0" width="120" height="80" fill="#3a4654"/>
      <polygon points="-10,40 60,-20 130,40" fill="#1c2530"/>
      <polygon points="-10,40 60,-20 60,40" fill="#2a3543"/>
    </g>
    <!-- House 2 -->
    <g transform="translate(400, 540)">
      <rect x="0" y="0" width="100" height="70" fill="#7d6042"/>
      <polygon points="-8,35 50,-15 108,35" fill="#3a4654"/>
    </g>
    <!-- House 3 -->
    <g transform="translate(820, 480)">
      <rect x="0" y="0" width="140" height="90" fill="#3a4654"/>
      <polygon points="-12,45 70,-25 152,45" fill="#1c2530"/>
      <polygon points="-12,45 70,-25 70,45" fill="#2a3543"/>
    </g>
    <!-- House 4 -->
    <g transform="translate(1080, 540)">
      <rect x="0" y="0" width="110" height="75" fill="#dcd5c0"/>
      <polygon points="-10,38 55,-20 120,38" fill="#3a4654"/>
    </g>
    <!-- House 5 -->
    <g transform="translate(1380, 500)">
      <rect x="0" y="0" width="130" height="80" fill="#7d6042"/>
      <polygon points="-12,40 65,-22 142,40" fill="#3a4654"/>
    </g>
    <!-- House 6 -->
    <g transform="translate(1620, 540)">
      <rect x="0" y="0" width="110" height="75" fill="#3a4654"/>
      <polygon points="-10,38 55,-20 120,38" fill="#1c2530"/>
    </g>

    <!-- Row 2 (below road) -->
    <g transform="translate(160, 860)">
      <rect x="0" y="0" width="120" height="80" fill="#dcd5c0"/>
      <polygon points="-10,40 60,-20 130,40" fill="#3a4654"/>
    </g>
    <g transform="translate(420, 880)">
      <rect x="0" y="0" width="110" height="70" fill="#3a4654"/>
      <polygon points="-10,35 55,-20 120,35" fill="#1c2530"/>
    </g>
    <g transform="translate(820, 860)">
      <rect x="0" y="0" width="130" height="80" fill="#7d6042"/>
      <polygon points="-12,40 65,-22 142,40" fill="#3a4654"/>
    </g>
    <g transform="translate(1100, 880)">
      <rect x="0" y="0" width="120" height="75" fill="#3a4654"/>
      <polygon points="-10,38 60,-22 130,38" fill="#1c2530"/>
    </g>
    <g transform="translate(1380, 860)">
      <rect x="0" y="0" width="130" height="80" fill="#dcd5c0"/>
      <polygon points="-12,40 65,-22 142,40" fill="#3a4654"/>
    </g>
    <g transform="translate(1640, 880)">
      <rect x="0" y="0" width="120" height="75" fill="#7d6042"/>
      <polygon points="-10,38 60,-22 130,38" fill="#3a4654"/>
    </g>
  </g>

  <!-- Vignette darken bottom for text overlay -->
  <rect width="1920" height="500" y="580" fill="#0a1620" opacity="0.4"/>
</svg>
