<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A cedar shake roof in mature New England woodland">
  <defs>
    <linearGradient id="cs-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a3c4d8"/>
      <stop offset="100%" stop-color="#d2e3eb"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#cs-sky)"/>

  <!-- Background trees -->
  <g fill="#1f3a2a">
    <ellipse cx="80" cy="350" rx="120" ry="220"/>
    <ellipse cx="200" cy="380" rx="110" ry="240"/>
    <ellipse cx="700" cy="360" rx="130" ry="230"/>
    <ellipse cx="780" cy="380" rx="100" ry="250"/>
  </g>
  <g fill="#2c4a3a">
    <ellipse cx="120" cy="340" rx="60" ry="100"/>
    <ellipse cx="720" cy="340" rx="60" ry="120"/>
  </g>

  <!-- Wide roof angle -->
  <polygon points="0,200 800,260 800,600 0,600" fill="#6b5237"/>

  <!-- Cedar shakes - rough textured rows -->
  <g stroke="#3d2c18" stroke-width="0.6">
