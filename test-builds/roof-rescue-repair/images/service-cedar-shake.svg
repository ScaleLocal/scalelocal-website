      <path d="M 140,228 L 175,230 L 178,268 L 143,266 Z"/>
      <path d="M 175,230 L 215,232 L 218,270 L 178,268 Z"/>
      <path d="M 215,232 L 250,234 L 253,272 L 218,270 Z"/>
      <path d="M 250,234 L 290,236 L 293,274 L 253,272 Z"/>
      <path d="M 290,236 L 325,238 L 328,276 L 293,274 Z"/>
      <path d="M 325,238 L 365,240 L 368,278 L 328,276 Z"/>
      <path d="M 365,240 L 400,242 L 403,280 L 368,278 Z"/>
      <path d="M 400,242 L 440,244 L 443,282 L 403,280 Z"/>
      <path d="M 440,244 L 475,246 L 478,284 L 443,282 Z"/>
      <path d="M 475,246 L 515,248 L 518,286 L 478,284 Z"/>
      <path d="M 515,248 L 550,250 L 553,288 L 518,286 Z"/>
      <path d="M 550,250 L 590,252 L 593,290 L 553,288 Z"/>
      <path d="M 590,252 L 625,254 L 628,292 L 593,290 Z"/>
      <path d="M 625,254 L 665,256 L 668,294 L 628,292 Z"/>
      <path d="M 665,256 L 700,258 L 703,296 L 668,294 Z"/>
      <path d="M 700,258 L 740,260 L 743,298 L 703,296 Z"/>
      <path d="M 740,260 L 800,262 L 800,302 L 743,298 Z"/>
