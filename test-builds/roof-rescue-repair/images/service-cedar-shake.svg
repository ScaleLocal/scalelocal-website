  <!-- Wood grain hints -->
  <g stroke="#3d2c18" stroke-width="0.4" opacity="0.4" fill="none">
    <path d="M 50,228 L 80,260"/>
    <path d="M 180,232 L 220,266"/>
    <path d="M 310,238 L 350,274"/>
    <path d="M 460,244 L 500,280"/>
    <path d="M 600,250 L 640,288"/>
    <path d="M 100,300 L 130,340"/>
    <path d="M 280,312 L 320,348"/>
    <path d="M 480,322 L 520,358"/>
