<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A roofing crew repairing a shingled roof at dusk">
  <defs>
    <linearGradient id="hm-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1e2e"/>
      <stop offset="35%" stop-color="#1d3d56"/>
      <stop offset="65%" stop-color="#3a6985"/>
      <stop offset="100%" stop-color="#dba76a"/>
    </linearGradient>
    <linearGradient id="hm-roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a4a58"/>
      <stop offset="100%" stop-color="#1c2530"/>
    </linearGradient>
    <linearGradient id="hm-roof2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#23303d"/>
      <stop offset="100%" stop-color="#0f161e"/>
    </linearGradient>
    <linearGradient id="hm-tree" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a3528"/>
      <stop offset="100%" stop-color="#0a1d14"/>
    </linearGradient>
    <pattern id="hm-shingles" x="0" y="0" width="80" height="36" patternUnits="userSpaceOnUse" patternTransform="skewX(-12)">
      <rect width="80" height="36" fill="url(#hm-roof)"/>
      <rect x="0" y="0" width="40" height="18" fill="#2d3a48" stroke="#101820" stroke-width="0.5"/>
      <rect x="40" y="0" width="40" height="18" fill="#36444f" stroke="#101820" stroke-width="0.5"/>
      <rect x="20" y="18" width="40" height="18" fill="#2a3543" stroke="#101820" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Sky -->
  <rect width="1920" height="1080" fill="url(#hm-sky)"/>

  <!-- Distant tree silhouettes -->
  <g fill="url(#hm-tree)" opacity="0.85">
    <ellipse cx="200" cy="720" rx="140" ry="90"/>
    <ellipse cx="350" cy="740" rx="180" ry="110"/>
    <rect x="180" y="700" width="40" height="120"/>
    <ellipse cx="1500" cy="730" rx="160" ry="100"/>
    <ellipse cx="1700" cy="750" rx="220" ry="130"/>
    <ellipse cx="1800" cy="740" rx="120" ry="80"/>
  </g>

  <!-- Background house silhouettes -->
  <g fill="#152330" opacity="0.85">
    <rect x="120" y="780" width="240" height="180"/>
    <polygon points="120,780 240,690 360,780"/>
    <rect x="1480" y="770" width="280" height="190"/>
    <polygon points="1480,770 1620,680 1760,770"/>
  </g>

  <!-- Foreground large house with sloped roof showing the repair scene -->
  <g>
    <!-- House body -->
    <rect x="480" y="650" width="960" height="430" fill="#7d6748"/>
    <rect x="480" y="650" width="960" height="430" fill="url(#hm-sky)" opacity="0.1"/>
    <!-- Siding lines -->
    <g stroke="#5a4a32" stroke-width="2" opacity="0.5">
      <line x1="480" y1="730" x2="1440" y2="730"/>
      <line x1="480" y1="810" x2="1440" y2="810"/>
      <line x1="480" y1="890" x2="1440" y2="890"/>
      <line x1="480" y1="970" x2="1440" y2="970"/>
    </g>
    <!-- Windows (lit) -->
    <rect x="560" y="780" width="120" height="160" fill="#f7d97a" opacity="0.92"/>
    <rect x="560" y="780" width="120" height="160" fill="none" stroke="#3a2e1a" stroke-width="4"/>
    <line x1="620" y1="780" x2="620" y2="940" stroke="#3a2e1a" stroke-width="3"/>
    <line x1="560" y1="860" x2="680" y2="860" stroke="#3a2e1a" stroke-width="3"/>

    <rect x="1240" y="780" width="120" height="160" fill="#f3cb5e" opacity="0.92"/>
    <rect x="1240" y="780" width="120" height="160" fill="none" stroke="#3a2e1a" stroke-width="4"/>
    <line x1="1300" y1="780" x2="1300" y2="940" stroke="#3a2e1a" stroke-width="3"/>
    <line x1="1240" y1="860" x2="1360" y2="860" stroke="#3a2e1a" stroke-width="3"/>

    <!-- Door -->
    <rect x="880" y="820" width="160" height="260" fill="#2a1f10"/>
    <rect x="880" y="820" width="160" height="260" fill="none" stroke="#3a2e1a" stroke-width="3"/>
    <rect x="900" y="850" width="120" height="160" fill="#f0b94a" opacity="0.7"/>
    <circle cx="1020" cy="970" r="6" fill="#f8d050"/>
  </g>

  <!-- Roof -->
  <polygon points="420,650 960,260 1500,650" fill="url(#hm-shingles)"/>
  <!-- Roof side (gable shadow plane) -->
  <polygon points="420,650 460,650 960,300 960,260" fill="url(#hm-roof2)" opacity="0.6"/>
  <!-- Roof ridge -->
  <line x1="425" y1="650" x2="1495" y2="650" stroke="#0a1018" stroke-width="3"/>

  <!-- Repair patch (lighter, new shingles) -->
  <g transform="translate(1080, 410)">
    <polygon points="0,0 220,0 230,120 -10,120" fill="#4a5a6a" stroke="#0a1018" stroke-width="2"/>
    <line x1="-5" y1="40" x2="225" y2="40" stroke="#2a3543" stroke-width="1"/>
    <line x1="-5" y1="80" x2="225" y2="80" stroke="#2a3543" stroke-width="1"/>
  </g>

  <!-- Ladder against side -->
  <g stroke="#d49a36" stroke-width="6" fill="none">
    <line x1="1530" y1="1080" x2="1430" y2="480"/>
    <line x1="1560" y1="1080" x2="1460" y2="480"/>
    <g stroke-width="4">
      <line x1="1540" y1="1020" x2="1565" y2="1020"/>
      <line x1="1532" y1="960" x2="1557" y2="960"/>
      <line x1="1524" y1="900" x2="1549" y2="900"/>
      <line x1="1516" y1="840" x2="1541" y2="840"/>
      <line x1="1508" y1="780" x2="1533" y2="780"/>
      <line x1="1500" y1="720" x2="1525" y2="720"/>
      <line x1="1492" y1="660" x2="1517" y2="660"/>
      <line x1="1484" y1="600" x2="1509" y2="600"/>
      <line x1="1476" y1="540" x2="1501" y2="540"/>
    </g>
  </g>

  <!-- Roofer silhouette on the roof -->
  <g transform="translate(1170, 380)">
    <!-- Body -->
    <ellipse cx="0" cy="40" rx="22" ry="36" fill="#0a1018"/>
    <!-- Head + hard hat -->
    <circle cx="0" cy="-2" r="14" fill="#1a242e"/>
    <path d="M -18 -2 Q 0 -22 18 -2 L 18 4 L -18 4 Z" fill="#d49a36"/>
    <!-- Arms holding hammer -->
    <line x1="6" y1="20" x2="38" y2="-4" stroke="#0a1018" stroke-width="9" stroke-linecap="round"/>
    <!-- Hammer head -->
    <rect x="34" y="-12" width="14" height="20" fill="#3a4654"/>
    <line x1="35" y1="-10" x2="35" y2="6" stroke="#1a242e" stroke-width="2"/>
  </g>

  <!-- Atmospheric fade at bottom -->
  <rect width="1920" height="320" y="760" fill="url(#hm-sky)" opacity="0.0"/>
  <rect width="1920" height="200" y="880" fill="#0a1620" opacity="0.4"/>
</svg>
