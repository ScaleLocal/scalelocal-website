<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Roof Rescue Repair — Dover, NH">
  <defs>
    <linearGradient id="og-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2a3c"/>
      <stop offset="100%" stop-color="#1e4156"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#og-bg)"/>
  <!-- Accent corner shapes -->
  <polygon points="0,0 360,0 0,360" fill="#3a7898" opacity="0.18"/>
  <polygon points="1200,630 840,630 1200,270" fill="#3a7898" opacity="0.18"/>

  <!-- Centerpiece logo (scaled) -->
  <g transform="translate(240, 130)">
    <!-- House icon -->
    <g transform="translate(0, 50) scale(1.6)">
      <rect x="22" y="74" width="116" height="56" rx="2" fill="#f8fafc" stroke="#f8fafc" stroke-width="2.5" opacity="0.9"/>
      <rect x="68" y="92" width="24" height="38" rx="1" fill="#1e4156"/>
      <rect x="38" y="92" width="20" height="18" fill="#a8c8db" stroke="#1e4156" stroke-width="1.5"/>
      <rect x="102" y="92" width="20" height="18" fill="#a8c8db" stroke="#1e4156" stroke-width="1.5"/>
      <polygon points="14,76 80,12 146,76 80,46" fill="#3a7898"/>
      <polygon points="80,12 146,76 80,46" fill="#4a8cb0"/>
      <rect x="100" y="20" width="14" height="32" fill="#1e4156"/>
      <circle cx="138" cy="44" r="22" fill="#f8d050" stroke="#1e4156" stroke-width="3"/>
      <g transform="translate(138, 44) rotate(-35)">
        <path d="M -10 -2.5 L 4 -2.5 L 4 -6 L 11 0 L 4 6 L 4 2.5 L -10 2.5 Z M -14 -6 a 4 4 0 1 0 0 12 a 4 4 0 1 0 0 -12 Z M -14 -2 a 2 2 0 1 1 0 4 a 2 2 0 1 1 0 -4 Z" fill="#1e4156" stroke="#1e4156" stroke-width="0.6"/>
      </g>
    </g>
    <!-- Wordmark -->
    <g transform="translate(320, 60)">
      <text x="0" y="80" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="72" fill="#ffffff">ROOF</text>
      <text x="0" y="170" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="72" fill="#a8c8db">RESCUE</text>
      <text x="0" y="240" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="800" font-size="56" letter-spacing="8" fill="#f8d050">REPAIR</text>
    </g>
  </g>

  <!-- Tagline strip -->
  <rect x="0" y="540" width="1200" height="90" fill="#0a1620"/>
  <text x="60" y="595" font-family="'Open Sans', sans-serif" font-weight="700" font-size="26" fill="#ffffff">Dover, NH &middot; Repair-First Roofing for the Seacoast</text>
  <text x="60" y="620" font-family="'Open Sans', sans-serif" font-weight="600" font-size="18" fill="#a8c8db">(603) 420-9071 &middot; roofrescuerepair.net</text>
</svg>
