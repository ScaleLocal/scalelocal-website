<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 760" role="img" aria-labelledby="ig2t ig2d" font-family="Inter, Arial, sans-serif">
  <title id="ig2t">What SEO costs a small business in 2026</title>
  <desc id="ig2d">SEO pricing ranges for small businesses in 2026: most retainers run between a few hundred and several thousand dollars per month, driven by competition, starting point, and scope.</desc>
  <rect width="760" height="760" fill="#0f2240"/>
  <rect x="0" y="0" width="760" height="112" fill="#0b1a30"/>
  <text x="380" y="46" fill="#2ecc71" font-size="14" font-weight="700" letter-spacing="2" text-anchor="middle">SCALELOCAL GUIDE</text>
  <text x="380" y="80" fill="#ffffff" font-size="26" font-weight="700" text-anchor="middle">What SEO costs a small business in 2026</text>
  <text x="380" y="102" fill="#9fb3c8" font-size="13" text-anchor="middle">Typical monthly retainer ranges by market</text>

  <!-- range bars -->
  <g>
    <text x="60" y="178" fill="#ffffff" font-size="15" font-weight="600">Low-competition local market</text>
    <rect x="60" y="190" width="300" height="30" rx="6" fill="#2b6cb0"/>
    <text x="372" y="211" fill="#9fb3c8" font-size="14">lower thousands / mo</text>
  </g>
  <g>
    <text x="60" y="262" fill="#ffffff" font-size="15" font-weight="600">Moderate-competition market</text>
    <rect x="60" y="274" width="440" height="30" rx="6" fill="#2b6cb0"/>
    <text x="512" y="295" fill="#9fb3c8" font-size="14">mid thousands / mo</text>
  </g>
  <g>
    <text x="60" y="346" fill="#ffffff" font-size="15" font-weight="600">Freelancer / narrow scope</text>
    <rect x="60" y="358" width="190" height="30" rx="6" fill="#3a6a4f"/>
    <text x="262" y="379" fill="#9fb3c8" font-size="14">few hundred+ / mo</text>
  </g>

  <text x="60" y="430" fill="#9fb3c8" font-size="13">Industry retainers for small businesses span from a few hundred to several</text>
  <text x="60" y="450" fill="#9fb3c8" font-size="13">thousand dollars per month. Source: 2026 industry SEO pricing surveys.</text>

  <!-- what drives the price -->
  <rect x="40" y="478" width="680" height="170" rx="12" fill="#13294a" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="64" y="508" fill="#2ecc71" font-size="13" font-weight="700" letter-spacing="1.5">WHAT DRIVES THE PRICE</text>
  <text x="64" y="538" fill="#ffffff" font-size="14">• Competition in your local market</text>
  <text x="64" y="562" fill="#ffffff" font-size="14">• Your starting point — does the site have an SEO foundation?</text>
  <text x="64" y="586" fill="#ffffff" font-size="14">• Scope — GBP only, or GBP + on-site SEO + content + citations</text>
  <text x="64" y="610" fill="#ffffff" font-size="14">• Whether the website build is included in the price</text>
  <text x="64" y="634" fill="#ffffff" font-size="14">• The team — solo freelancer, small agency, or large firm</text>

  <!-- scalelocal -->
  <rect x="40" y="664" width="680" height="56" rx="12" fill="#2ecc71"/>
  <text x="380" y="690" fill="#0f2240" font-size="15" font-weight="700" text-anchor="middle">ScaleLocal: transparent plans $249–$1,497/mo — website included, no hidden fees</text>
  <text x="380" y="710" fill="#0f2240" font-size="12" text-anchor="middle">scalelocal.net/pricing</text>

  <text x="380" y="746" fill="#7f93a8" font-size="12" text-anchor="middle">ScaleLocal — Web design, SEO &amp; AI growth for local service businesses · scalelocal.net</text>
</svg>
