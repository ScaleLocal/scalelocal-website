<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 980" role="img" aria-labelledby="ig1t ig1d" font-family="Inter, Arial, sans-serif">
  <title id="ig1t">How to grow your business online in 2026 — the 5-step sequence</title>
  <desc id="ig1d">A ScaleLocal framework: build the website, win local search, gain AI-search visibility, capture every lead, and build reviews — in priority order.</desc>
  <rect width="760" height="980" fill="#0f2240"/>
  <rect x="0" y="0" width="760" height="118" fill="#0b1a30"/>
  <text x="380" y="50" fill="#2ecc71" font-size="15" font-weight="700" letter-spacing="2" text-anchor="middle">SCALELOCAL FRAMEWORK</text>
  <text x="380" y="86" fill="#ffffff" font-size="27" font-weight="700" text-anchor="middle">How to grow your business online in 2026</text>
  <text x="380" y="108" fill="#9fb3c8" font-size="13" text-anchor="middle">The five steps, in the order that actually works</text>

  <!-- Step 1 -->
  <g>
    <circle cx="74" cy="200" r="30" fill="#2b6cb0"/>
    <text x="74" y="209" fill="#fff" font-size="24" font-weight="700" text-anchor="middle">1</text>
    <text x="128" y="186" fill="#ffffff" font-size="20" font-weight="700">Build a website that gets found</text>
    <text x="128" y="212" fill="#9fb3c8" font-size="14">Fast, mobile-first, clear about what you do and where.</text>
    <text x="128" y="232" fill="#9fb3c8" font-size="14">It is the foundation every other channel points back to.</text>
  </g>
  <line x1="74" y1="240" x2="74" y2="290" stroke="#2b6cb0" stroke-width="3"/>
  <!-- Step 2 -->
  <g>
    <circle cx="74" cy="330" r="30" fill="#2b6cb0"/>
    <text x="74" y="339" fill="#fff" font-size="24" font-weight="700" text-anchor="middle">2</text>
    <text x="128" y="316" fill="#ffffff" font-size="20" font-weight="700">Win local search</text>
    <text x="128" y="342" fill="#9fb3c8" font-size="14">Google Business Profile, citations, and on-site local SEO.</text>
    <text x="128" y="362" fill="#9fb3c8" font-size="14">The highest-return channel for most local businesses.</text>
  </g>
  <line x1="74" y1="370" x2="74" y2="420" stroke="#2b6cb0" stroke-width="3"/>
  <!-- Step 3 -->
  <g>
    <circle cx="74" cy="460" r="30" fill="#2b6cb0"/>
    <text x="74" y="469" fill="#fff" font-size="24" font-weight="700" text-anchor="middle">3</text>
    <text x="128" y="446" fill="#ffffff" font-size="20" font-weight="700">Get visible in AI search</text>
    <text x="128" y="472" fill="#9fb3c8" font-size="14">Clean structured data and consistent content so</text>
    <text x="128" y="492" fill="#9fb3c8" font-size="14">ChatGPT, Gemini and Perplexity can recommend you.</text>
  </g>
  <line x1="74" y1="500" x2="74" y2="550" stroke="#2b6cb0" stroke-width="3"/>
  <!-- Step 4 -->
  <g>
    <circle cx="74" cy="590" r="30" fill="#2b6cb0"/>
    <text x="74" y="599" fill="#fff" font-size="24" font-weight="700" text-anchor="middle">4</text>
    <text x="128" y="576" fill="#ffffff" font-size="20" font-weight="700">Capture every lead</text>
    <text x="128" y="602" fill="#9fb3c8" font-size="14">Instant-response tools — chat, AI receptionist, follow-up.</text>
    <text x="128" y="622" fill="#9fb3c8" font-size="14">Traffic only matters if it converts into booked work.</text>
  </g>
  <line x1="74" y1="630" x2="74" y2="680" stroke="#2b6cb0" stroke-width="3"/>
  <!-- Step 5 -->
  <g>
    <circle cx="74" cy="720" r="30" fill="#2ecc71"/>
    <text x="74" y="729" fill="#0f2240" font-size="24" font-weight="700" text-anchor="middle">5</text>
    <text x="128" y="706" fill="#ffffff" font-size="20" font-weight="700">Build reviews</text>
    <text x="128" y="732" fill="#9fb3c8" font-size="14">Ask every satisfied customer; respond to every review.</text>
    <text x="128" y="752" fill="#9fb3c8" font-size="14">Free, compounding, and a top local-ranking factor.</text>
  </g>

  <!-- key principle box -->
  <rect x="40" y="800" width="680" height="118" rx="12" fill="#13294a" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="380" y="838" fill="#2ecc71" font-size="14" font-weight="700" letter-spacing="1.5" text-anchor="middle">THE PRINCIPLE</text>
  <text x="380" y="868" fill="#ffffff" font-size="17" font-weight="600" text-anchor="middle">Pick two or three channels and execute them consistently.</text>
  <text x="380" y="894" fill="#9fb3c8" font-size="14" text-anchor="middle">Spreading thin across every channel produces less than focusing on a few.</text>

  <text x="380" y="952" fill="#7f93a8" font-size="12" text-anchor="middle" fill-opacity="0.85"><tspan fill="#7f93a8">ScaleLocal — Web design, SEO &amp; AI growth for local service businesses</tspan></text>
  <text x="380" y="970" fill="#7f93a8" font-size="12" text-anchor="middle">scalelocal.net</text>
</svg>
