# Render Blueprint — BD++ Sniper API
# Lives at: ScaleLocal/scalelocal-website/bdpp/render.yaml
# Tell Render: New > Blueprint > point at this repo > Blueprint path: bdpp/render.yaml

databases:
  - name: bdpp-postgres
    plan: free
    databaseName: bdpp
    user: bdpp

services:
  - type: web
    name: bdpp-api
    env: docker
    plan: free
    rootDir: bdpp
    dockerfilePath: server/Dockerfile
    dockerContext: .
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bdpp-postgres
          property: connectionString
      - key: BDPP_ACCESS_TOKEN
        generateValue: true
      - key: MILLIONVERIFIER_TOKEN
        sync: false
      - key: OUTSCRAPER_TOKEN
        sync: false
      - key: APOLLO_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GOOGLE_CSE_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DEFAULT_MAX_SPEND_USD
        value: "6.0"
