<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScaleLocal | Your Recommendation</title>
  <meta name="description" content="Based on your answers, here's exactly what ScaleLocal would build for your business.">
  <link rel="canonical" href="https://scalelocal.net/recommendation">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased}
    body{font-family:'Inter',sans-serif;font-size:1rem;line-height:1.6;color:#1a1a2e;background:#f0f4f8;min-height:100vh}
    .topbar{width:100%;background:#1a2e4a;padding:16px 24px;text-align:center}
    .topbar a{text-decoration:none}
    .logo-scale{font-family:'Montserrat',sans-serif;font-weight:700;font-size:22px;color:#fff}
    .logo-local{font-family:'Montserrat',sans-serif;font-weight:400;font-size:22px;color:#2E75B6}
    .rec-wrap{max-width:700px;margin:0 auto;padding:40px 24px 64px}
    .rec-eyebrow{color:#2ecc71;text-transform:uppercase;font-family:'Inter',sans-serif;font-size:0.6875rem;letter-spacing:0.22em;font-weight:600;margin-bottom:12px;text-align:center}
    .rec-headline{font-family:'Montserrat',sans-serif;font-weight:800;color:#1a2e4a;font-size:1.75rem;line-height:1.15;text-align:center;margin-bottom:32px}
    @media(min-width:768px){.rec-headline{font-size:2.25rem}}
    .rec-copy{background:#fff;border-radius:16px;padding:32px;box-shadow:0 4px 24px rgba(26,46,74,0.08);border:1px solid #e2e8f0;margin-bottom:32px}
    @media(min-width:768px){.rec-copy{padding:48px}}
    .rec-copy-text{font-family:'Inter',sans-serif;font-size:1rem;color:#4a5a6e;line-height:1.7;white-space:pre-line}
    .rec-plan-card{background:#1a2e4a;border-radius:16px;padding:32px;border:2px solid #2ecc71;margin-bottom:24px}
    @media(min-width:768px){.rec-plan-card{padding:48px}}
    .rec-plan-tier{font-family:'Inter',sans-serif;font-size:0.6875rem;text-transform:uppercase;letter-spacing:0.15em;color:#2ecc71;font-weight:600;margin-bottom:8px}
    .rec-plan-name{font-family:'Montserrat',sans-serif;font-weight:800;color:#fff;font-size:2rem;margin-bottom:8px}
    .rec-plan-tagline{font-family:'Inter',sans-serif;font-size:1rem;color:#a8b8cc;margin-bottom:20px}
    .rec-plan-price{font-family:'Montserrat',sans-serif;font-weight:800;color:#fff;font-size:2.5rem;line-height:1}
    .rec-plan-period{font-family:'Inter',sans-serif;font-size:1rem;color:#a8b8cc}
    .rec-plan-setup{font-family:'Inter',sans-serif;font-size:0.8125rem;color:#2ecc71;font-weight:600;margin-top:4px;display:block}
    .rec-plan-guarantee{background:rgba(46,204,113,0.1);border:1px solid rgba(46,204,113,0.3);border-radius:8px;padding:12px 16px;font-family:'Inter',sans-serif;font-size:0.875rem;color:#2ecc71;margin-top:24px;line-height:1.4}
    .rec-cta{display:flex;align-items:center;justify-content:center;width:100%;height:56px;background:#2ecc71;color:#1a2e4a;font-family:'Montserrat',sans-serif;font-weight:700;font-size:1.0625rem;border:none;border-radius:8px;cursor:pointer;text-decoration:none;transition:all 0.2s;margin-top:24px}
    .rec-cta:hover{filter:brightness(1.1);transform:translateY(-1px);box-shadow:0 6px 20px rgba(46,204,113,0.35)}
    .rec-secondary{display:block;text-align:center;margin-top:16px;font-family:'Inter',sans-serif;font-size:0.875rem;color:#6b7a8d;text-decoration:none;transition:color 0.2s}
    .rec-secondary:hover{color:#2ecc71}
    .rec-ai-flag{background:#162338;border-radius:12px;padding:24px 32px;margin-top:24px;border-left:4px solid #f39c12}
    .rec-ai-flag-title{font-family:'Montserrat',sans-serif;font-weight:700;color:#f39c12;font-size:0.9375rem;margin-bottom:8px}
    .rec-ai-flag-body{font-family:'Inter',sans-serif;font-size:0.875rem;color:#a8b8cc;line-height:1.6}
  </style>
</head>
<body>
  <header class="topbar"><a href="/"><span class="logo-scale">Scale</span><span class="logo-local">Local</span></a></header>
  <div class="rec-wrap">
    <p class="rec-eyebrow">YOUR RECOMMENDATION</p>
    <h1 class="rec-headline" id="rec-headline">Here&rsquo;s what we&rsquo;d build for your business.</h1>
    <div class="rec-copy"><div class="rec-copy-text" id="rec-copy-text">Loading your recommendation...</div></div>
    <div class="rec-plan-card" id="rec-plan-card"></div>
    <div id="rec-ai-section"></div>
    <a href="/checkout" class="rec-cta" id="rec-cta">Build My Plan &rarr;</a>
    <a href="/menu" class="rec-secondary">See all plans &amp; pricing &rarr;</a>
  </div>
  <script>
  document.addEventListener('DOMContentLoaded', function() {
    var quizData = {};
    try { quizData = JSON.parse(sessionStorage.getItem('sl_quiz') || '{}'); } catch(e) {}

    // GATE: If no quiz data, redirect to /start first
    if (!quizData.recommendation || !quizData.first_name) {
      window.location.href = '/start?return=quiz';
      return;
    }

    var tier = quizData.recommendation || 'foundation';
    var fn = quizData.first_name || '';
    var bn = quizData.business_name || 'your business';
    var q2text = quizData.q2_answer_text || 'several calls';
    var q2weekly = quizData.q2_weekly || 0;
    var q4text = quizData.q4_answer_text || 'no formal follow-up process';
    var aiFlag = quizData.ai_flag || 'off';

    // Recommendation copy blocks
    var copyBlocks = {
      foundation: "Hey " + fn + " \u2014 based on what you told us, you're in a better position than most businesses we talk to.\n\nYou're answering your calls, you have some follow-up in place, and you have capacity for growth. What you need right now isn't more infrastructure \u2014 you need to make sure customers can actually find you when they search Google.\n\nThat's exactly what Foundation is built for. We'll get your Google presence dialed in, your reviews compounding, and make sure every lead that finds you converts \u2014 with a written guarantee of 3 new leads per month by day 60 or we work free.\n\n$497/mo. No base setup fee on a 6-month or 12-month commitment.",
      momentum: "Hey " + fn + " \u2014 here's what you told us about " + bn + ".\n\nYou told us you're missing " + q2text + " calls a day \u2014 that's potentially " + q2weekly + " calls a week going unanswered. And your follow-up process? " + q4text + " \u2014 which means those leads aren't being followed up with either.\n\nThat's not a small problem. That's revenue leaving every single week \u2014 going to whoever answers their phone.\n\nMomentum is built for exactly this. We get you in the map pack, we run paid ads that bring in calls you're not seeing today, and we put a follow-up system in place that works even when you're heads down on a job. 8 guaranteed leads per month or we work free.\n\n$1,297/mo. No base setup fee on a 6-month or 12-month commitment.",
      authority: "Hey " + fn + " \u2014 let's be honest about what's happening at " + bn + ".\n\nYou told us you're missing " + q2text + " calls a day \u2014 that's roughly " + q2weekly + " calls a week going unanswered. You're not sure where you show up on Google. And your follow-up? " + q4text + ".\n\nThat's three separate problems compounding on each other. Foundation or Momentum alone won't fix this \u2014 you need the full stack.\n\nAuthority covers everything \u2014 your Google presence, paid ads across Google and Meta, and a follow-up system that runs automatically. You can also add the ScaleLocal AI Receptionist, which answers every call before it ever hits voicemail \u2014 24/7. It qualifies the caller, books the appointment, and sends you a summary while you sleep.\n\n20 guaranteed leads per month. $1,997/mo. Base setup fees waived on a 6-month or 12-month commitment. AI Receptionist is a $997 one-time setup if you choose to add it."
    };

    var planData = {
      foundation: { tier: 'FOUNDATION SYSTEM', name: 'Foundation', tagline: 'Get found. Get reviewed. Get calls.', price: '$497', setup: '$0 setup', guarantee: '\u2705 Guaranteed: minimum 3 new leads/month by day 60 \u2014 or we work for free.' },
      momentum: { tier: 'MOMENTUM SYSTEM', name: 'Momentum', tagline: 'Dominate your local market.', price: '$1,297', setup: '$0 setup', guarantee: '\u2705 Guaranteed: minimum 8 new leads/month by day 90 \u2014 or we work for free.' },
      authority: { tier: 'AUTHORITY SYSTEM', name: 'Authority', tagline: 'Total market dominance. AI-powered.', price: '$1,997', setup: '$997 one-time setup', guarantee: '\u2705 Guaranteed: minimum 20 new leads/month by day 90 \u2014 or we work for free.' }
    };

    var aiCopy = {
      urgent: "One more thing \u2014 given what you told us about missed calls, we'd strongly recommend adding the AI Receptionist if you're not on Authority.\n\nEvery call you're missing right now is a lead your competitor is picking up. The receptionist answers before it ever hits voicemail, qualifies the caller, books the job, and sends you a full summary. It pays for itself the first week.\n\n$997 one-time setup + $297/mo added to your Momentum plan.",
      suggested: "Worth mentioning \u2014 based on your call volume, the AI Receptionist could be a good fit down the road. It handles overflow calls and after-hours coverage so nothing slips through. We can add it anytime \u2014 we'll check in with you at month three.",
      off: "One more thing \u2014 based on your call volume right now, we probably wouldn't push the AI Receptionist yet. You're managing your calls well. If that changes \u2014 volume increases, voicemails start stacking up \u2014 it's an easy add-on and we can have it live within 72 hours. We'll check in with you at month three."
    };

    // Render
    document.getElementById('rec-headline').innerHTML = 'Here\u2019s what we\u2019d build for ' + bn + '.';
    document.getElementById('rec-copy-text').textContent = copyBlocks[tier] || copyBlocks.foundation;

    var pd = planData[tier] || planData.foundation;
    document.getElementById('rec-plan-card').innerHTML = '<p class="rec-plan-tier">' + pd.tier + '</p><h2 class="rec-plan-name">' + pd.name + '</h2><p class="rec-plan-tagline">' + pd.tagline + '</p><div><span class="rec-plan-price">' + pd.price + '</span><span class="rec-plan-period">/mo</span></div><span class="rec-plan-setup">' + pd.setup + ' \u00b7 6-month commitment</span><div class="rec-plan-guarantee">' + pd.guarantee + '</div>';

    // AI Receptionist section
    if (tier !== 'authority' && (aiFlag === 'urgent' || aiFlag === 'suggested')) {
      document.getElementById('rec-ai-section').innerHTML = '<div class="rec-ai-flag"><p class="rec-ai-flag-title">' + (aiFlag === 'urgent' ? '\u26A0 Recommended: AI Receptionist' : '\uD83D\uDCA1 Worth considering: AI Receptionist') + '</p><p class="rec-ai-flag-body">' + (aiCopy[aiFlag] || '') + '</p></div>';
    } else if (aiFlag === 'off' && tier !== 'authority') {
      document.getElementById('rec-ai-section').innerHTML = '<div class="rec-ai-flag" style="border-left-color:#2ecc71;"><p class="rec-ai-flag-title" style="color:#2ecc71;">\u2705 AI Receptionist: Not needed right now</p><p class="rec-ai-flag-body">' + aiCopy.off + '</p></div>';
    }

    // CTA link
    document.getElementById('rec-cta').href = '/checkout?plan=' + tier + '&name=' + encodeURIComponent((quizData.first_name || '') + ' ' + (quizData.last_name || '')) + '&company=' + encodeURIComponent(bn);
  });
  </script>
</body>
</html>
